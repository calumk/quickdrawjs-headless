<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quickdraw headless example — browser reference</title>
<link rel="stylesheet" href="../../core/src/quickdraw.css">
<style>
  html, body { margin: 0; height: 100%; }
  #board { position: fixed; inset: 0; }
  #label {
    position: fixed; left: 12px; bottom: 10px; z-index: 10;
    font: 12px/1.4 system-ui, sans-serif; color: #666; background: #fff;
    border: 1px solid #ddd; border-radius: 8px; padding: 6px 10px;
    pointer-events: none;
  }
  #metrics {
    position: fixed; right: 12px; bottom: 10px; z-index: 10; max-width: 46ch;
    font: 12px/1.5 ui-monospace, monospace; color: #222; background: #fff;
    border: 1px solid #ddd; border-radius: 8px; padding: 6px 10px;
    pointer-events: none; white-space: pre-wrap; word-break: break-word;
  }
</style>
</head>
<body>
<div id="board"></div>
<div id="label">Browser render of <code>board.json</code> — compare with <code>board.png</code> (headless render).</div>
<div id="metrics"></div>
<script type="module">
  import { Editor, pageBounds, noteLayout } from '../../core/src/index.js'
  import { boundsUnion } from '../../core/src/geometry.js'

  const snapshot = await (await fetch('./board.json', { cache: 'no-store' })).json()
  const editor = new Editor({
    container: document.getElementById('board'),
    theme: 'light',
    readonly: true,
    hideUi: true,
    watermark: false,
  })
  editor.store.loadSnapshot(snapshot)

  // Fit all shapes into view (same idea as headless content-fit).
  const fit = () => {
    const shapes = editor.store.shapes()
    let b = null
    for (const s of shapes) b = boundsUnion(b, pageBounds(s))
    if (!b) return
    const W = innerWidth, H = innerHeight, pad = 48
    const z = Math.min((W - pad * 2) / b.w, (H - pad * 2) / b.h)
    editor.setCamera({ x: pad / z - b.x, y: pad / z - b.y, z })
  }
  fit()
  addEventListener('resize', fit)

  // Ground-truth report: which font the browser actually used for layout,
  // and how the sticky note wrapped. Compare with the headless render —
  // both must agree exactly (same outlines => same breaks).
  const report = async () => {
    try { await document.fonts.ready } catch {}
    const el = document.getElementById('metrics')
    const handOk = (() => {
      try { return document.fonts.check(`500 20px 'Quickdraw Hand'`, 'Remember:') } catch { return 'n/a' }
    })()
    const notes = editor.store.shapes().filter((s) => s.type === 'note').map((s) => ({
      id: s.id,
      size: s.props.size,
      text: s.props.text,
      lines: noteLayout(s).lines.map((l) => l.text),
    }))
    // raw probe widths on the board's own canvas: same outlines => same numbers
    const probe = 'Remember: demo on Friday'
    const widths = {}
    try {
      const c = document.createElement('canvas').getContext('2d')
      for (const [k, f] of [
        ['stack', `500 20px 'Quickdraw Hand', 'Libre Baskerville', Georgia, serif`],
        ['georgia', '500 20px Georgia, serif'],
      ]) {
        c.font = f
        widths[k] = +c.measureText(probe).width.toFixed(1)
      }
    } catch { widths.err = 'n/a' }
    let faces = 'n/a'
    try { faces = [...document.fonts].map((f) => `${f.family}/${f.weight}/${f.status}`).join(', ') } catch {}
    el.innerHTML =
      `<b>browser metrics</b> Quickdraw-Hand-active=${handOk}<br>` +
      `faces: ${faces}<br>` +
      `probe20: ${JSON.stringify(widths)}<br>` +
      notes.map((n) => `<b>${n.id}</b> [${n.size}] ${JSON.stringify(n.text)}<br>↳ ${JSON.stringify(n.lines)}`).join('<br>')
  }
  // report twice: immediately (fallback metrics, if any) and after webfonts
  report()
  setTimeout(report, 1500)
</script>
</body>
</html>
